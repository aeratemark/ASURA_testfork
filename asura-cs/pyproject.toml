[project]
name = "asura-construction-set"
version = "0.1.0"
description = "TES Construction Set / Nox style world and content editor for the ASURA Guild Wars server"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "numpy>=1.24"]

[project.optional-dependencies]
3d = ["panda3d>=1.10.13"]
dev = ["pytest"]

[project.scripts]
asura-cs = "asura_cs.ui.main_window:main_entry"

[tool.setuptools.packages.find]
include = ["asura_cs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
